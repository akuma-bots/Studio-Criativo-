services:
  - type: worker
    name: studio-criativo-pro
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: studio-criativo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/studio_criativo.db
